source:
  type: postgres
  config:
    host_port: "${POSTGRES_HOST}:${POSTGRES_PORT}"
    database: "${POSTGRES_DATABASE}"
    username: "${POSTGRES_USERNAME}"
    password: "${POSTGRES_PASSWORD}"
    include_tables: true
    include_views: true
    include_table_lineage: true
    profiling:
      enabled: false
    stateful_ingestion:
      enabled: true

sink:
  type: datahub-rest
  config:
    server: "${DATAHUB_GMS_URL}"
    token: "${DATAHUB_TOKEN}"

