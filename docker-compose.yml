services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: matismart_knowledge
      POSTGRES_USER: matismart
      POSTGRES_PASSWORD: matismart_local_only
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matismart -d matismart_knowledge"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    environment:
      MATISMART_ENV: local
      DATABASE_URL: postgresql://matismart:matismart_local_only@postgres:5432/matismart_knowledge
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:

