[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "matismart-knowledge-hub"
version = "0.1.0"
description = "Matismart Knowledge & AI Integration Hub metadata and governance repository."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
api = [
  "alembic>=1.13.0",
  "fastapi>=0.115.0",
  "psycopg[binary]>=3.2.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "sqlalchemy>=2.0.0"
]
datahub = [
  "acryl-datahub[postgres]>=0.14.0",
  "pyyaml>=6.0.0"
]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.0.0",
  "pyyaml>=6.0.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["apps*", "packages*"]
exclude = ["datahub*", "database*", "docs*", "infra*", "tests*"]
