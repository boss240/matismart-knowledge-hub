[project]
name = "matismart-knowledge-hub"
version = "0.1.0"
description = "Matismart Knowledge & AI Integration Hub metadata and governance repository."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
api = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0"
]
datahub = [
  "acryl-datahub[postgres]>=0.14.0",
  "pyyaml>=6.0.0"
]
dev = [
  "pytest>=8.0.0",
  "pyyaml>=6.0.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
