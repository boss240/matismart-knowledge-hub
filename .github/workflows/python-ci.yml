name: Python CI

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "alembic.ini"
      - "database/alembic/**"
      - "packages/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/python-ci.yml"
  pull_request:
    paths:
      - "apps/**"
      - "alembic.ini"
      - "database/alembic/**"
      - "packages/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/python-ci.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[api,dev]"

      - name: Validate Alembic migrations
        run: |
          alembic history --verbose
          alembic upgrade head --sql > /tmp/matismart_alembic.sql
          test -s /tmp/matismart_alembic.sql

      - name: Run tests
        run: pytest -q
