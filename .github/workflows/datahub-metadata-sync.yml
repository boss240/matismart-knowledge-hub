name: DataHub Metadata Sync

on:
  push:
    branches: [main]
    paths:
      - "datahub/**"
      - ".github/workflows/datahub-metadata-sync.yml"
      - "docs/datahub/**"
  workflow_dispatch:
    inputs:
      apply_to_datahub:
        description: "Apply metadata to DataHub. Requires real repository secrets."
        required: true
        default: false
        type: boolean

jobs:
  metadata-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate metadata files
        run: |
          pip install pyyaml
          python - <<'PY'
          from pathlib import Path
          import yaml

          for path in list(Path("datahub").rglob("*.yml")) + list(Path(".github").rglob("*.yml")):
              yaml.safe_load(path.read_text(encoding="utf-8"))

          domains = yaml.safe_load(Path("datahub/metadata/domains.yml").read_text(encoding="utf-8"))["domains"]
          expected = {
              "Product Knowledge",
              "Technical Documentation",
              "Customer Projects",
              "AI Knowledge",
              "Energy Assets",
              "IoT & Tuya",
              "EMS",
              "Commercial",
              "Regulatory",
          }
          actual = {domain["name"] for domain in domains}
          if actual != expected:
              raise SystemExit(f"Domain mismatch: {sorted(actual ^ expected)}")

          print("Metadata validation passed.")
          PY

  datahub-sync:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply_to_datahub }}
    needs: metadata-validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[datahub]"

      - name: Validate required secrets
        env:
          DATAHUB_GMS_URL: ${{ secrets.DATAHUB_GMS_URL }}
          DATAHUB_TOKEN: ${{ secrets.DATAHUB_TOKEN }}
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          POSTGRES_DATABASE: ${{ secrets.POSTGRES_DATABASE }}
          POSTGRES_USERNAME: ${{ secrets.POSTGRES_USERNAME }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          missing=()
          for name in DATAHUB_GMS_URL DATAHUB_TOKEN POSTGRES_HOST POSTGRES_PORT POSTGRES_DATABASE POSTGRES_USERNAME POSTGRES_PASSWORD; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done

          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required GitHub Actions secrets: ${missing[*]}"
            echo "Add them in GitHub: Settings -> Secrets and variables -> Actions -> New repository secret."
            exit 1
          fi

      - name: Ingest PostgreSQL metadata
        env:
          DATAHUB_GMS_URL: ${{ secrets.DATAHUB_GMS_URL }}
          DATAHUB_TOKEN: ${{ secrets.DATAHUB_TOKEN }}
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          POSTGRES_DATABASE: ${{ secrets.POSTGRES_DATABASE }}
          POSTGRES_USERNAME: ${{ secrets.POSTGRES_USERNAME }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: datahub ingest -c datahub/ingestion/postgres-pgvector.yml

      - name: Bootstrap Matismart governance metadata
        env:
          DATAHUB_GMS_URL: ${{ secrets.DATAHUB_GMS_URL }}
          DATAHUB_TOKEN: ${{ secrets.DATAHUB_TOKEN }}
          DATAHUB_ENV: PROD
        run: python datahub/scripts/bootstrap_matismart_datahub.py
